<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050713" />
  <title>VENSO Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/design-system.css?v=pass1-20261113" />
</head>
<body class="admin-body">
  <div class="noise"></div>
  <div class="stars stars-one"></div>
  <div class="stars stars-two"></div>

  <main class="admin-shell">
    <section class="admin-card login-card" id="loginView">
      <a class="brand admin-brand" href="/"><span class="venso-site-lockup" aria-label="Venso"><svg class="venso-site-mark" viewBox="0 0 82 42" aria-hidden="true" focusable="false"><g transform="translate(0 4) scale(.18) translate(-369 -408)"><path d="M394.807 477.74C411.535 442.172 454.196 408.25 503.401 416.212C551.112 423.546 585.715 454.739 612.224 485.732C613.195 486.887 614.159 488.02 615.114 489.13C638.395 516.134 664.847 539.403 691.693 539.713C719.392 540.963 751.297 514.298 774.217 483.409C779.44 476.454 784.389 469.171 789 461.525C787.783 470.373 785.913 479.198 783.424 487.937C771.978 525.656 749.686 570.73 696.636 582.493C642.158 591.238 601.197 555.106 574.192 524.362C573.052 523.038 571.914 521.69 570.776 520.317C527.199 464.221 464.115 424.906 402.99 483.928C396.606 489.692 390.547 496.07 385 503.025C387.338 494.436 390.647 485.933 394.807 477.74Z" fill="currentColor"/><circle cx="392" cy="525" r="23" fill="currentColor"/></g></svg><span class="venso-site-word">VENSO</span></span></a>
      <h1>Админка VENSO</h1>
      <p>Здесь можно менять тарифы лендинга и смотреть заявки. Пароль по умолчанию указан в README.</p>
      <form id="loginForm" class="admin-form">
        <label>Пароль администратора<input type="password" name="password" placeholder="Введите пароль" required /></label>
        <button class="primary-btn" type="submit">Войти</button>
      </form>
      <div class="admin-alert" id="loginAlert"></div>
    </section>

    <section class="admin-dashboard" id="dashboardView" hidden>
      <div class="admin-topbar">
        <a class="brand admin-brand" href="/"><span class="venso-site-lockup" aria-label="Venso"><svg class="venso-site-mark" viewBox="0 0 82 42" aria-hidden="true" focusable="false"><g transform="translate(0 4) scale(.18) translate(-369 -408)"><path d="M394.807 477.74C411.535 442.172 454.196 408.25 503.401 416.212C551.112 423.546 585.715 454.739 612.224 485.732C613.195 486.887 614.159 488.02 615.114 489.13C638.395 516.134 664.847 539.403 691.693 539.713C719.392 540.963 751.297 514.298 774.217 483.409C779.44 476.454 784.389 469.171 789 461.525C787.783 470.373 785.913 479.198 783.424 487.937C771.978 525.656 749.686 570.73 696.636 582.493C642.158 591.238 601.197 555.106 574.192 524.362C573.052 523.038 571.914 521.69 570.776 520.317C527.199 464.221 464.115 424.906 402.99 483.928C396.606 489.692 390.547 496.07 385 503.025C387.338 494.436 390.647 485.933 394.807 477.74Z" fill="currentColor"/><circle cx="392" cy="525" r="23" fill="currentColor"/></g></svg><span class="venso-site-word">VENSO</span></span></a>
        <div>
          <h1>Управление лендингом</h1>
          <p>Редактирование тарифов происходит без правки кода.</p>
        </div>
        <button class="ghost-btn sm" id="logoutBtn">Выйти</button>
      </div>

      <div class="admin-columns">
        <section class="admin-card tariffs-editor">
          <div class="admin-section-title">
            <h2>Тарифы</h2>
            <button class="ghost-btn sm" id="addTariffBtn" type="button">Добавить тариф</button>
          </div>
          <form id="tariffsForm">
            <div id="tariffsEditor"></div>
            <button class="primary-btn" type="submit">Сохранить тарифы</button>
          </form>
          <div class="admin-alert" id="saveAlert"></div>
        </section>

        <aside class="admin-card leads-panel">
          <div class="admin-section-title">
            <h2>Заявки</h2>
            <button class="ghost-btn sm" id="refreshLeadsBtn" type="button">Обновить</button>
          </div>
          <div class="leads-list" id="leadsList"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="/js/admin.js" defer></script>
</body>
</html>
