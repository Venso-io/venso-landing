# =============================================================================
# CI — образ лендинга (статика public/ на Caddy) в GHCR + обновление стенда
# =============================================================================
#   - push в main / тег v* / ручной запуск — собирает Dockerfile и пушит
#     ghcr.io/<owner>/<repo> (latest, sha-…, ветка/тег)
#   - pull_request — только сборка
#   - main → стенд обновляется сразу (общий stage-deploy.yml из venso_deploy,
#     Watchtower), итог — в Telegram (tg-notify.yml)
# GHCR-доступ — встроенный GITHUB_TOKEN; для stage-deploy нужен секрет
# STAGE_DEPLOY_TOKEN (тот же, что у backend/frontend).
# =============================================================================

name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-stage:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: Venso-io/venso_deploy/.github/workflows/stage-deploy.yml@main
    with:
      service: venso-landing
    secrets: inherit

  notify:
    needs: build
    if: always()
    uses: Venso-io/venso_deploy/.github/workflows/tg-notify.yml@main
    with:
      service: venso-landing
      status: ${{ needs.build.result }}
