# =============================================================================
# CI — образ лендинга (статика public/ на Caddy) в GHCR + обновление стенда
# =============================================================================
#   - push в main / тег v* / ручной запуск — собирает Dockerfile и пушит
#     ghcr.io/<owner>/<repo> (latest, sha-…, ветка/тег)
#   - pull_request — только сборка
#   - стенд подтягивает новый latest сам: Watchtower опрашивает GHCR раз в 5 минут
# Репо публичный — общие stage-deploy.yml / tg-notify.yml из приватного venso_deploy
# ему недоступны (GitHub не даёт публичным репо звать приватные reusable workflows),
# а копировать их сюда нельзя: в них токены. Поэтому без мгновенного деплоя и Telegram.
# GHCR-доступ — встроенный GITHUB_TOKEN.
# =============================================================================

name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
